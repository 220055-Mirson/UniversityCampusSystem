# Render Blueprint — Smart Campus Core (Neon + Render, plano gratuito)
#
# Deploy unificado: API + frontend no MESMO serviço (evita CORS entre domínios Render).
# URL único: https://smart-campus-api-XXXX.onrender.com/login
#
# Deploy: https://render.com/deploy?repo=https://github.com/armandocorreia/UniversityCampusSystem
# Setup BD: npm run provision:deploy (Neon) → colar DATABASE_URL no Render.

services:
  - type: web
    name: smart-campus-api
    runtime: node
    plan: free
    buildCommand: bash .scripts/render-build-unified.sh
    startCommand: bash .scripts/render-start-api.sh
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: http://localhost:5173
      - key: LOG_LEVEL
        value: info
